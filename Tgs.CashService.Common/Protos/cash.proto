syntax = "proto3";

option csharp_namespace = "Tgs.Cash.Protos";
package payment;

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";

message BidRequest {
	phoenix.protobuf.GuidValue wallet_id = 1;
}

message BidResponse {
	string subject = 1;
}

message WalletExchangeRequest {
	phoenix.protobuf.GuidValue wallet_id = 1;
	string TransactionType = 2;
	phoenix.protobuf.DecimalValue amount = 3;
	phoenix.protobuf.DecimalValue lock_amount = 4;
	optional string description = 5;
	optional string external_id = 6;
	optional phoenix.protobuf.GuidValue created_user = 7;
}

message WalletExchangeResponse {
	phoenix.protobuf.GuidValue transaction_id = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	phoenix.protobuf.DecimalValue locked_balance = 3;
}

message BalanceRequest {
	phoenix.protobuf.GuidValue wallet_id = 1;
}

message BalanceResponse {
	phoenix.protobuf.DecimalValue balance = 1;
}
