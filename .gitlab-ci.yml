variables:
  ServiceImageName: pgtgs/cashservice-api
  WorkerImageName: pgtgs/cashservice-worker
  TgsServiceSettingKey: cashservice-api
  TgsWorkerSettingKey: cashservice-worker
  HelmTemplateServiceFolderName: cashservice-api
  HelmTemplateWorkerFolderName: cashservice-worker

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-nuget:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.CashService.Client/Tgs.CashService.Client.csproj" --no-restore --no-build
    - dotnet nuget push "Tgs.CashService.Client/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.Promotion.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: Tgs.Database.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - dotnet build "Tgs.CashService/Tgs.CashService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ServiceImageName:$Tag" --no-restore
    - docker push $ServiceImageName:$Tag
    - dotnet build "Tgs.CashServiceWorker/Tgs.CashServiceWorker.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$WorkerImageName:$Tag" --no-restore
    - docker push $WorkerImageName:$Tag

push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateServiceFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ServiceImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
    - cp -R deployment/k8s/$HelmTemplateWorkerFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(WorkerImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-service-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
    TgsSettingKey: $TgsServiceSettingKey
    HelmTemplateFolderName: $HelmTemplateServiceFolderName
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources
      }
      EOF

