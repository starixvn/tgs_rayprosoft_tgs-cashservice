    kube_config: KubeConfig_Raypro_dev
  environment:
    name: transfer-job-dev
  stage: deploy-dev
  needs:
    - push-tool-docker-image
    - job: push-tool-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - |
      cat << EOF | deploy_k8s default $HelmTemplateAgentWalletTransferFolderName $namespace
        {
          "resources": {
            "limits": {
              "cpu": "1",
              "memory": "500Mi"
            },
            "requests": {
              "cpu": "100m",
              "memory": "100Mi"
            }
          }
        }
      EOF

