include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/cashservice-api
  WorkerImageName: pgtgs/cashservice-worker
  QueryImageName: pgtgs/cashservice-query
  TgsServiceSettingKey: cashservice-api
  TgsWorkerSettingKey: cashservice-worker
  TgsQuerySettingKey: cash-query
  HelmTemplateServiceFolderName: cashservice-api
  HelmTemplateWorkerFolderName: cashservice-worker
  HelmTemplateQueryFolderName: cashservice-query
  BuildCacheKey: Tgs.CashService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.CashService.Client"
    - push_package "Tgs.CashQuery.Client"

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.CashService/Tgs.CashService.csproj" $ServiceImageName $Tag
    - push_docker "Tgs.CashServiceWorker/Tgs.CashServiceWorker.csproj" $WorkerImageName $Tag
    - push_docker "Tgs.CashQueryService/Tgs.CashQueryService.csproj" $QueryImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag
    - push_k8s_template $HelmTemplateQueryFolderName $QueryImageName $Tag

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace
        {
          "restart": {
            "enabled": true,
            "schedule": "0 23 * * *"
          }
        }
      EOF

deploy-worker-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: worker-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace
        {
          "restart": {
            "enabled": true,
            "schedule": "0 23 * * *"
          }
        }
      EOF

deploy-query-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: query-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsQuerySettingKey $HelmTemplateQueryFolderName $namespace

