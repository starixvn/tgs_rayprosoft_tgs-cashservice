include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/cashservice-api
  WorkerImageName: pgtgs/cashservice-worker
  TgsServiceSettingKey: cashservice-api
  TgsWorkerSettingKey: cashservice-worker
  HelmTemplateServiceFolderName: cashservice-api
  HelmTemplateWorkerFolderName: cashservice-worker
  BuildCacheKey: Tgs.CashService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_nuget "Tgs.CashService.Client"
    
push-docker-image:
  extends: .push-docker-image-template
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - dotnet build "Tgs.CashService/Tgs.CashService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ServiceImageName:$Tag" --no-restore
    - docker push $ServiceImageName:$Tag
    - dotnet build "Tgs.CashServiceWorker/Tgs.CashServiceWorker.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$WorkerImageName:$Tag" --no-restore
    - docker push $WorkerImageName:$Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateServiceFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ServiceImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateServiceFolderName/values.yaml
    - cp -R deployment/k8s/$HelmTemplateWorkerFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(WorkerImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateWorkerFolderName/values.yaml

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    TgsSettingKey: $TgsServiceSettingKey
    HelmTemplateFolderName: $HelmTemplateServiceFolderName
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: always

deploy-worker-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    TgsSettingKey: $TgsWorkerSettingKey
    HelmTemplateFolderName: $HelmTemplateWorkerFolderName
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: worker-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: always

deploy-service-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    TgsSettingKey: $TgsServiceSettingKey
    HelmTemplateFolderName: $HelmTemplateServiceFolderName
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: service-staging
  stage: deploy-staging
  needs:
    - deploy-service-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main

deploy-worker-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    TgsSettingKey: $TgsWorkerSettingKey
    HelmTemplateFolderName: $HelmTemplateWorkerFolderName
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: worker-staging
  stage: deploy-staging
  needs:
    - deploy-worker-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main

deploy-service-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    TgsSettingKey: $TgsServiceSettingKey
    HelmTemplateFolderName: $HelmTemplateServiceFolderName
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: service-prod
  stage: deploy-prod
  needs:
    - deploy-service-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual

deploy-worker-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    TgsSettingKey: $TgsWorkerSettingKey
    HelmTemplateFolderName: $HelmTemplateWorkerFolderName
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: worker-prod
  stage: deploy-prod
  needs:
    - deploy-worker-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
