include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/cashservice-api
  WorkerImageName: pgtgs/cashservice-worker
  TgsServiceSettingKey: cashservice-api
  TgsWorkerSettingKey: cashservice-worker
  HelmTemplateServiceFolderName: cashservice-api
  HelmTemplateWorkerFolderName: cashservice-worker
  BuildCacheKey: Tgs.CashService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.CashService.Client"

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.CashService/Tgs.CashService.csproj" $ServiceImageName $Tag
    - push_docker "Tgs.CashServiceWorker/Tgs.CashServiceWorker.csproj" $WorkerImageName $Tag

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: worker-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-service-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: service-staging
  stage: deploy-staging
  needs:
    - deploy-service-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-staging:
  extends: .deploy-template
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
  environment:
    name: worker-staging
  stage: deploy-staging
  needs:
    - deploy-worker-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace

deploy-service-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: service-prod
  stage: deploy-prod
  needs:
    - deploy-service-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  script:
    - deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace

deploy-worker-prod:
  extends: .deploy-template
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
  environment:
    name: worker-prod
  stage: deploy-prod
  needs:
    - deploy-worker-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  script:
    - deploy_k8s $TgsWorkerSettingKey $HelmTemplateWorkerFolderName $namespace