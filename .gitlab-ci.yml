include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ServiceImageName: pgtgs/cashservice-api
  WorkerImageName: pgtgs/cashservice-worker
  QueryImageName: pgtgs/cashservice-query
  CommitterImageName: pgtgs/cashservice-committer
  AgentWalletTransferImageName: pgtgs/agent-wallet-transfer
  WalletSnapshotTransferImageName: pgtgs/wallet-snapshot-transfer
  CountervailImageName: pgtgs/wallet-countervail
  TgsServiceSettingKey: cashservice-api
  TgsWorkerSettingKey: cashservice-worker
  TgsCommitterSettingKey: cashservice-committer
  TgsQuerySettingKey: cash-query
  HelmTemplateServiceFolderName: cashservice-api
  HelmTemplateWorkerFolderName: cashservice-worker
  HelmTemplateQueryFolderName: cashservice-query
  HelmTemplateCommitterFolderName: cashservice-committer
  HelmTemplateAgentWalletTransferFolderName: agent-wallet-transfer
  HelmTemplateCountervailFolderName: cashservice-countervail
  HelmTemplateWalletSnapshotTransferFolderName: wallet-snapshot-transfer
  BuildCacheKey: Tgs.CashService.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  extends: .push-nuget-template
  script:
    - push_package "Tgs.CashService.Client"
    - push_package "Tgs.CashQuery.Client"
  artifacts:
    paths:
      - Tgs.CashService.Client/bin/$BuildConfiguration/*.nupkg
      - Tgs.CashQuery.Client/bin/$BuildConfiguration/*.nupkg

push-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "Tgs.CashService" $ServiceImageName $Tag
    - push_docker "Tgs.CashServiceWorker" $WorkerImageName $Tag
    - push_docker "Tgs.CashQueryService" $QueryImageName $Tag
    - push_docker "Tgs.CashServiceCommitter" $CommitterImageName $Tag

push-tool-docker-image:
  extends: .push-docker-image-template
  script:
    - push_docker "AgentWalletTransferTool" $AgentWalletTransferImageName $Tag
    - push_docker "RefreshAllWalletsTool" $CountervailImageName $Tag
    - push_docker "WalletSanpshotTransferTool" $WalletSnapshotTransferImageName $Tag
  when: manual

push-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateServiceFolderName $ServiceImageName $Tag
    - push_k8s_template $HelmTemplateWorkerFolderName $WorkerImageName $Tag
    - push_k8s_template $HelmTemplateCommitterFolderName $CommitterImageName $Tag
    - push_k8s_template $HelmTemplateQueryFolderName $QueryImageName $Tag

push-tool-k8s-template:
  extends: .push-k8s-template
  script:
    - push_k8s_template $HelmTemplateAgentWalletTransferFolderName $AgentWalletTransferImageName $Tag
    - push_k8s_template $HelmTemplateCountervailFolderName $CountervailImageName $Tag
    - push_k8s_template $HelmTemplateWalletSnapshotTransferFolderName $WalletSnapshotTransferImageName $Tag
  needs:
    - push-tool-docker-image

deploy-service-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: service-dev
  stage: deploy-dev
  needs:
    - push-nuget
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: on_success
  script:
    - |
      cat << EOF | deploy_k8s $TgsServiceSettingKey $HelmTemplateServiceFolderName $namespace
        {
          "restart": {
            "enabled": true,
            "schedule": "0 23 * * *"
          }
        }
      EOF

deploy-worker-dev:
  extends: .deploy-template
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
  environment:
    name: worker-dev
  stage: deploy-dev
