syntax = "proto3";

option csharp_namespace = "Tgs.Cash.Protos";
package payment;

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";

message BidRequest {
	phoenix.protobuf.GuidValue wallet_id = 1;
}

message BidResponse {
	string subject = 1;
}

message WalletExchangeRequest {
	phoenix.protobuf.GuidValue wallet_id = 1;
	string TransactionType = 2;
	phoenix.protobuf.GuidValue brand_id = 3;
	string player_code = 4;
	phoenix.protobuf.DecimalValue amount = 5;
	string description = 6;
	string external_id = 7;
	phoenix.protobuf.GuidValue created_user = 8;
}

message WalletExchangeResponse {
	phoenix.protobuf.GuidValue transaction_id = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}
